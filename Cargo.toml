[package]
name = "slark"
version = "0.0.0"
edition = "2018"
publish = false
license = "AGPL-3.0-or-later"
authors = ["Kaur Kuut <admin@kaurkuut.com>"]

[dependencies]
masonry = { git = "https://github.com/linebender/xilem", rev = "c85ace612bca7af7df695799356b59b966e2b152" }
masonry_winit = { git = "https://github.com/linebender/xilem", rev = "c85ace612bca7af7df695799356b59b966e2b152" }

interprocess = { git = "https://github.com/kotauskas/interprocess", rev = "fc5f2a22a05dea8833f1505a41d2b79a449a412b" }
png = "0.17.16"
jpeg-decoder = "0.2.6"
webp-animation = "0.6.0"
gif = "0.11.4"
gif-dispose = "3.1.1"
imgref = "1.12.0"
rgb = "0.8.52"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.44"
rfd = "0.16.0"
pathdiff = "0.2.3"

[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.dev.package.masonry]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
incremental = true

[profile.dev.package.masonry_core]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
incremental = true

[profile.dev.package.masonry_winit]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
incremental = true
